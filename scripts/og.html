<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(/fonts/archivo-wdth.woff2);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:G;src:url(/fonts/space-grotesk.woff2);font-weight:300 700}
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;background:#0d0d10;color:#f3f2ea;font-family:G;position:relative;overflow:hidden;
background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:48px 48px}
.brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:16px;font:900 36px A}
.m{width:60px;height:60px;background:#c6ff3d;color:#000;border:4px solid #000;box-shadow:5px 5px 0 #f3f2ea;display:grid;place-items:center;font-size:38px;border-radius:8px}
.brand b{color:#c6ff3d}
.pill{position:absolute;left:72px;top:160px;padding:12px 16px;background:#000;border:4px solid #f3f2ea;border-radius:8px;font:700 20px G;letter-spacing:.1em}
h1{position:absolute;left:72px;top:228px;font:900 100px/.98 A;font-stretch:78%;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
h1 mark{background:#c6ff3d;color:#000;padding:0 14px;border:5px solid #000;box-shadow:8px 8px 0 #f3f2ea;display:inline-block;transform:rotate(-1.5deg);border-radius:8px}
h1 span{display:block}.o{color:transparent;-webkit-text-stroke:3px #f3f2ea;text-shadow:6px 6px 0 #c6ff3d}
.bx{position:absolute;border:5px solid #000;border-radius:10px;transform:skewX(-30deg) rotate(-8deg)}
.b1{right:-40px;top:380px;width:330px;height:130px;background:#1d1d27;border-color:#f3f2ea}
.b2{right:0px;top:300px;width:260px;height:110px;background:#f3f2ea;box-shadow:10px 10px 0 #bdbcb2}
.b3{right:30px;top:215px;width:190px;height:90px;background:#c6ff3d;box-shadow:10px 10px 0 #8fc412;display:grid;place-items:center;font:900 64px A;color:#000}
.b3 i{display:block;transform:skewX(30deg);font-style:normal}
</style></head><body><div class=brand><div class=m>S</div><div>SANTANIC<b>.ID</b></div></div>
<div class=pill>INDEPENDENT DIGITAL STUDIO</div>
<h1><span>WE BUILD</span><span>THE <mark>DIGITAL</mark></span><span class=o>FUTURE.</span></h1>
<div class="bx b1"></div><div class="bx b2"></div><div class="bx b3"><i>S</i></div></body></html>
